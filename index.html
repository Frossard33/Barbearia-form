<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Inadimplência — Tecinco</title>
<meta name="description" content="Painel financeiro de títulos em aberto e inadimplência por filial.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topo">
  <div class="topo-in">
    <div class="marca">
      <span class="logo" aria-hidden="true">T</span>
      <div>
        <h1>Painel de Inadimplência</h1>
        <p id="ref" class="sub"></p>
      </div>
    </div>
    <div class="modo" role="tablist" aria-label="Tipo de conta">
      <button data-modo="R" class="on" role="tab">A receber <small>clientes</small></button>
      <button data-modo="P" role="tab">A pagar <small>fornecedores</small></button>
    </div>
  </div>
  <nav id="abas" class="abas" aria-label="Filiais"></nav>
</header>

<main id="app" class="app" aria-live="polite"></main>

<footer class="rodape">
  <span id="sync" class="sync"></span>
  <span class="acoes">
    <button id="btnExport" class="btn-sec">Exportar ajustes</button>
    <label class="btn-sec">Importar ajustes<input id="fileImport" type="file" accept="application/json" hidden></label>
    <button id="btnPrint" class="btn-sec">Imprimir / PDF</button>
  </span>
</footer>

<script src="js/chart.umd.js"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
